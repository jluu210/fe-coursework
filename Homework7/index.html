<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Google Layout Replica</title>
    <link href="styles/main.css" rel="stylesheet" type="text/css" />
  </head>
  <body>
    <header class="top-nav">
      <div class="nav-left">
        <a href="#">About</a>
        <a href="#">Store</a>
      </div>

      <div class="nav-right">
        <a href="#">Gmail</a>
        <a href="#">Images</a>
        <a href="#" class="grid-icon">
          <img src="assets/grid.png" alt="Google apps" />
        </a>
        <a href="#" class="icon-symbol">
          <img src="assets/circle-j.jpg" alt="Profile" />
        </a>
      </div>
    </header>

    <main class="main-content">
      <div class="logo-box">
        <img src="assets/Google_png.png" alt="Google-PNG" />
      </div>

      <div class="search-area">
        <button class="search-icon" type="button">✚</button>

        <input type="text" placeholder="Search..." />

        <div class="search-actions">
          <button type="button">🎙️</button>
          <button type="button">◉</button>
          <button class="ai-button" type="button">✧ AI Mode</button>
        </div>
      </div>

      <div class="action-buttons">
        <button>Button 1</button>
        <button>Button 2</button>
        <button>Button 3</button>
        <button>Button 4</button>
      </div>
    </main>

    <section class="message">
      Build, create, and do more with AI tools from Google
    </section>

    <footer class="footer">
      <div class="footer-top">
        <a href="#">Advertising</a>
        <a href="#">Business</a>
        <a href="#">How Search works</a>
      </div>

      <div class="footer-bottom">
        <a href="#">Privacy</a>
        <a href="#">Terms</a>
        <a href="#">Settings</a>
      </div>
    </footer>
  </body>
</html>
